general {
    # ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3 
    blur_size = 4
    noise = 0.02
    contrast = 0.89
    brightness = 0.7
    vibrancy = 0.1696
}

label {
    monitor =
    text = $TIME
    color = rgba(220, 220, 204, 1.0)
    font_size = 100
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = Hello, $USER
    color = rgba(220, 220, 204, 0.8)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(127, 127, 127, 1.0)
    inner_color = rgba(63, 63, 63, 0.5)
    font_color = rgba(220, 220, 204, 1.0)
    fade_on_empty = true
    placeholder_text = <span foreground="##dcdccc">Password...</span>
    hide_input = false
    rounding = 10 
    check_color = rgba(220, 220, 204, 1.0)
    fail_color = rgba(255, 100, 100, 1.0)
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] playerctl metadata --format "{{ artist }} - {{ title }}"
    color = rgba(220, 220, 204, 0.6)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -100
    halign = center
    valign = center
}
